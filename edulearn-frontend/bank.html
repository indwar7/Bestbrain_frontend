  <style>
    :root{
      --ink:#1A1F36;--bg:#F7F9FC;--card:#FFFFFF;--muted:#64748B;--bg2:#F5F7FA;
      --line:rgba(15,23,42,.10);--teal:#10B981;--rose:#F43F5E;--amber:#F59E0B;
      --aurora:linear-gradient(115deg,#10B981 0%,#6366F1 48%,#F59E0B 100%);
      --ease:cubic-bezier(.22,1,.36,1);--shadow:0 18px 44px rgba(15,23,42,.10);
    }
    html.dark-mode{
      --ink:#F5F7FA;--bg:#0F172A;--bg2:#1E293B;--card:#1A2847;
      --muted:#94A3B8;--line:rgba(255,255,255,.12);
      --shadow:0 18px 44px rgba(0,0,0,.45);
    }
    *{box-sizing:border-box;}
    [hidden]{display:none !important;}
    body{margin:0;font-family:'Nunito',system-ui,sans-serif;background:var(--bg);color:var(--ink);}
    .wrap{max-width:760px;margin:0 auto;padding:36px 24px 80px;}
    .top-link{display:inline-block;margin-bottom:18px;color:var(--muted);font-size:13px;text-decoration:none;}
    h1{font-family:'Fraunces',serif;font-weight:480;font-size:32px;margin:0 0 6px;}
    h1 em{font-style:italic;background:var(--aurora);-webkit-background-clip:text;background-clip:text;color:transparent;}
    .sub{color:var(--muted);font-size:14px;margin:0 0 22px;}
    .card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:26px;margin-bottom:16px;}

    .qnum{font-family:'Fragment Mono',monospace;font-size:12px;letter-spacing:.08em;
          text-transform:uppercase;color:var(--muted);margin-bottom:10px;
          display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
    .diff{padding:3px 9px;border-radius:999px;font-size:11px;background:var(--bg2);}
    .qtext{font-size:18px;font-weight:700;line-height:1.45;margin:0 0 18px;}
    .opts{display:grid;gap:10px;}
    .opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
         padding:14px 16px;min-height:52px;border-radius:14px;border:1px solid var(--line);
         background:var(--bg2);color:var(--ink);font-size:15px;font-family:inherit;cursor:pointer;
         transition:border-color .18s,background .18s;}
    .opt:hover:not(:disabled){border-color:var(--teal);}
    .opt:disabled{cursor:default;}
    .opt__k{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
            background:var(--card);font-family:'Fragment Mono',monospace;font-size:12px;}
    /* bank-* rather than is-right/is-wrong on purpose. kid-quiz.js watches the
       document for `.opt.is-wrong` and launches a full-screen explainer video
       — right for a timed test, wrong here: it covers the inline explanation
       this page exists to show, on every single wrong answer while drilling. */
    .opt.bank-right{border-color:var(--teal);background:rgba(16,185,129,.14);}
    .opt.bank-wrong{border-color:var(--rose);background:rgba(244,63,94,.12);}
    .opt__v{margin-left:auto;font-weight:900;font-size:16px;flex:none;}


    .expl{margin-top:14px;padding:13px 15px;border-radius:12px;background:var(--bg2);font-size:14px;line-height:1.6;}
    .expl b{display:block;margin-bottom:4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
    .verdict{font-weight:800;margin-bottom:6px;}
    .verdict.ok{color:#047857;} .verdict.no{color:#BE123C;}
    html.dark-mode .verdict.ok{color:#6EE7B7;} html.dark-mode .verdict.no{color:#FDA4AF;}
    .coin{display:inline-block;margin-left:8px;padding:3px 9px;border-radius:999px;font-size:12px;
          background:rgba(245,158,11,.16);color:#B45309;font-weight:700;}
    html.dark-mode .coin{color:#FCD34D;}

    .navrow{display:flex;gap:12px;align-items:center;margin-top:20px;flex-wrap:wrap;}
    .btn{border:none;border-radius:12px;background:var(--aurora);color:#0B1224;font-weight:700;font-size:15px;
         padding:13px 20px;cursor:pointer;min-height:44px;transition:transform .2s,box-shadow .2s;}
    .btn:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(16,185,129,.3);}
    .btn-ghost{border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--ink);
               font-weight:600;font-size:14px;padding:11px 18px;cursor:pointer;min-height:44px;}
    .tally{margin-left:auto;color:var(--muted);font-size:13px;}
    .gate,.empty{padding:56px 20px;text-align:center;color:var(--muted);}
    .gate a{color:var(--teal);font-weight:600;}

    @media (max-width:600px){
      .wrap{padding:24px 16px 64px;}
      h1{font-size:26px;}
      .card{padding:18px;border-radius:16px;}
      .qtext{font-size:17px;}
      .navrow .btn,.navrow .btn-ghost{flex:1;}
      .tally{margin-left:0;width:100%;}
    }
  </style>

  <h1>Question <em>Bank</em></h1>
  <p class="sub" id="sub">Practise this chapter. No timer, no marks — answer, see why, keep going.</p>

  <div id="gate" class="gate" hidden>
    Please <a href="login.html">log in</a> as a student to practise.
  </div>
  <div id="empty" class="empty" hidden>No practice questions for this chapter yet.</div>

  <div id="quiz" hidden>
    <div class="card">
      <div class="qnum"><span id="qnum">Question 1</span><span class="diff" id="diff"></span></div>
      <p class="qtext" id="qtext"></p>
      <div class="opts" id="opts"></div>
      <div id="feedback"></div>
      <div class="navrow">
        <button class="btn" id="nextBtn" type="button" hidden>Next question</button>
        <button class="btn-ghost" id="moreBtn" type="button" hidden>Practise more</button>
        <span class="tally" id="tally"></span>
      </div>
    </div>
  </div>

  <script src="api.js"></script>
  <script>
  /* ============================================================
     QUESTION BANK — untimed chapter practice
     ------------------------------------------------------------
     Deliberately not a test. There is no timer, no running score sent
     anywhere, and no submission: the student answers, the server says whether
     that was right and why, and they move on. Getting one wrong is not a
     penalty, so the answer is revealed either way — the point is to learn the
     thing now rather than at the end of a paper.

     Nothing here knows a correctIndex until the server replies to that one
     answer, which is the same contract the mock test works to.

     Reaching the end offers another set rather than a score screen. A score
     would turn practice back into a test.
     ============================================================ */
  (function () {
    'use strict';
    var params = new URLSearchParams(location.search);
    var chapterSlug = params.get('ch') || '';
    var subjectKey = params.get('subject') || '';
    var SUBJECT_NAME = { maths: 'Maths', science: 'Science', social: 'Social Science', english: 'English', hindi: 'Hindi' };
    var subject = SUBJECT_NAME[subjectKey] || 'Science';

    var el = function (id) { return document.getElementById(id); };

    /* Paint a right/wrong verdict so it survives the skin.
       kid-bg turns any near-white opaque surface into glass by writing
       background-color and border-color INLINE with !important — no stylesheet
       rule can outrank that, which is why .opt.bank-right rendered identical
       to every other option. Setting the same properties inline afterwards
       replaces those declarations, and the low-alpha accent this writes does
       not meet the pass's own >=.82-alpha bar, so it is not glassed again.

       The glyph is not decoration. Correctness must not depend on colour
       alone — for colour-blind readers, and because this is exactly the sort
       of styling a later skin pass can take away again. */
    function markState(node, kind) {
      var teal = 'rgba(16,185,129,.22)', rose = 'rgba(244,63,94,.20)';
      var edge = kind === 'right' ? '#10B981' : '#F43F5E';
      node.style.setProperty('background-color', kind === 'right' ? teal : rose, 'important');
      node.style.setProperty('border-color', edge, 'important');
      var glyph = document.createElement('span');
      glyph.className = 'opt__v';
      glyph.textContent = kind === 'right' ? '✓' : '✗';
      glyph.style.setProperty('color', edge, 'important');
      glyph.setAttribute('aria-label', kind === 'right' ? 'correct answer' : 'your answer, incorrect');
      node.appendChild(glyph);
    }

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    var Q = [];        // the set being drilled
    var i = 0;         // which question
    var answered = 0, right = 0;

    function load() {
      if (!window.EduAPI || !EduAPI.getUser || !EduAPI.getUser()) {
        el('gate').hidden = false;
        return;
      }
      EduAPI.getQuestionBank(subject, chapterSlug || undefined, 10).then(function (res) {
        Q = res.questions || [];
        if (!Q.length) { el('empty').hidden = false; return; }
        if (chapterSlug) {
          el('sub').textContent = 'Practising ' + chapterSlug.replace(/-/g, ' ') +
            '. No timer, no marks — answer, see why, keep going.';
        }
        i = 0;
        el('quiz').hidden = false;
        paint();
      }).catch(function () {
        el('empty').hidden = false;
        el('empty').textContent = 'Could not load practice questions. Check your connection and try again.';
      });
    }

    function paint() {
      var q = Q[i];
      el('qnum').textContent = 'Question ' + (i + 1) + ' of ' + Q.length;
      el('diff').textContent = q.difficulty || '';
      el('qtext').textContent = q.text;
      el('feedback').innerHTML = '';
      el('nextBtn').hidden = true;
      el('moreBtn').hidden = true;
      el('opts').innerHTML = q.options.map(function (o, n) {
        return '<button class="opt" data-i="' + n + '" type="button">' +
          '<span class="opt__k">' + String.fromCharCode(65 + n) + '</span>' +
          '<span>' + esc(o) + '</span></button>';
      }).join('');
      Array.prototype.forEach.call(el('opts').querySelectorAll('.opt'), function (b) {
        b.addEventListener('click', function () { answer(q, Number(b.getAttribute('data-i'))); });
      });
      updateTally();
    }

    function answer(q, chosen) {
      // Lock the options the moment one is picked, so a second click cannot
      // ask the server again for a question that has already been graded.
      var buttons = el('opts').querySelectorAll('.opt');
      Array.prototype.forEach.call(buttons, function (b) { b.disabled = true; });

      EduAPI.answerBankQuestion(q.id, chosen).then(function (r) {
        answered += 1;
        if (r.correct) right += 1;

        Array.prototype.forEach.call(buttons, function (b, n) {
          if (n === r.correctIndex) { b.classList.add('bank-right'); markState(b, 'right'); }
          else if (n === chosen) { b.classList.add('bank-wrong'); markState(b, 'wrong'); }
        });

        el('feedback').innerHTML =
          '<div class="expl">' +
            '<div class="verdict ' + (r.correct ? 'ok' : 'no') + '">' +
              (r.correct ? 'Correct' : 'Not quite') +
              (r.coinsAwarded ? '<span class="coin">+' + r.coinsAwarded + ' coin</span>' : '') +
            '</div>' +
            (r.explanation ? '<b>Why</b>' + esc(r.explanation) : '') +
          '</div>';

        el('nextBtn').hidden = i >= Q.length - 1;
        el('moreBtn').hidden = i < Q.length - 1;
        updateTally();
      }).catch(function () {
        Array.prototype.forEach.call(buttons, function (b) { b.disabled = false; });
        el('feedback').innerHTML = '<div class="expl">Could not check that answer. Try again.</div>';
      });
    }

    function updateTally() {
      el('tally').textContent = answered ? right + ' right of ' + answered + ' answered' : '';
    }

    el('nextBtn').addEventListener('click', function () {
      if (i < Q.length - 1) { i += 1; paint(); }
    });
    // A fresh sample rather than the same ten again — the API samples, so
    // asking again deals a different set.
    el('moreBtn').addEventListener('click', function () { load(); });

    load();
  })();
  </script>

  <script src="account-menu.js"></script>
  <script src="../theme.js"></script>
</body>
