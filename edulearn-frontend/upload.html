<!-- Redesign: dark canvas before any stylesheet parses, so switching pages
     never flashes white. boot.js is not deferred on purpose — the theme
     classes have to be set before the page CSS lands. -->

<style>html{background:#050505!important;color-scheme:dark}html body{background:#050505}</style>
<script src="ui/boot.js"></script>
  <meta charset="UTF-8">
  <!-- Apply saved theme before paint to avoid a light-mode flash. -->
  <script>/* light-only product: strip any stale dark preference before paint */try{if(!document.documentElement.classList.contains('kid-dark')){document.documentElement.classList.remove('dark-mode');}localStorage.setItem('edulearn-theme','light');}catch(e){}</script>

  <style>
    :root{
      --ink:#1A1F36;--bg:#F7F9FC;--card:#FFFFFF;--muted:#64748B;--bg2:#F5F7FA;
      --line:rgba(15,23,42,.10);--teal:#10B981;
      --aurora:linear-gradient(115deg,#10B981 0%,#6366F1 48%,#F59E0B 100%);
      --ease:cubic-bezier(.22,1,.36,1);--shadow:0 18px 44px rgba(15,23,42,.10);
    }
    /* Dark mode: remap the page's own variables so the whole UI flips. */
    html.dark-mode{
      --ink:#F5F7FA;--bg:#0F172A;--bg2:#1E293B;--card:#1A2847;
      --muted:#94A3B8;--line:rgba(255,255,255,.12);
      --shadow:0 18px 44px rgba(0,0,0,.45);
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Nunito',system-ui,sans-serif;background:var(--bg);color:var(--ink);}
    .wrap{max-width:640px;margin:0 auto;padding:40px 24px 60px;}
    h1{font-family:'Fraunces',serif;font-weight:480;font-size:32px;margin:0 0 6px;}
    h1 em{font-style:italic;background:var(--aurora);-webkit-background-clip:text;background-clip:text;color:transparent;}
    .sub{color:var(--muted);font-size:14px;margin:0 0 26px;}
    .card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:28px;}
    label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px;font-weight:600;}
    input,select,textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);font-size:14px;font-family:inherit;margin-bottom:16px;transition:border-color .2s,box-shadow .2s;}
    input:focus,select:focus,textarea:focus{outline:none;border-color:#3DE8C5;box-shadow:0 0 0 3px rgba(61,232,197,.15);}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
    .utype{display:flex;gap:8px;background:var(--line);padding:4px;border-radius:12px;margin-bottom:18px;}
    .utype__tab{flex:1;border:0;background:transparent;padding:9px 12px;border-radius:9px;font:inherit;font-weight:700;font-size:13.5px;color:var(--muted);cursor:pointer;transition:background .15s,color .15s;}
    .utype__tab.on{background:var(--card,#fff);color:var(--ink,#0B1224);box-shadow:0 1px 3px rgba(0,0,0,.12);}
    .drop{border:2px dashed var(--line);border-radius:16px;padding:30px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s;margin-bottom:16px;}
    .drop:hover,.drop.over{border-color:#3DE8C5;background:rgba(61,232,197,.05);}
    .drop .ico{font-size:34px;}
    .drop .t{font-weight:600;margin-top:8px;}
    .drop .s{font-size:12px;color:var(--muted);margin-top:4px;}
    .file-name{font-size:13px;color:var(--teal);font-weight:600;margin-top:8px;}
    .btn{width:100%;border:none;border-radius:12px;background:var(--aurora);color:#0B1224;font-weight:700;font-size:16px;padding:14px;cursor:pointer;transition:transform .2s,box-shadow .2s;}
    .btn:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(61,232,197,.3);}
    .btn:disabled{opacity:.6;cursor:default;transform:none;box-shadow:none;}
    .msg{margin-top:14px;padding:12px 14px;border-radius:11px;font-size:14px;display:none;}
    .msg.ok{background:rgba(15,169,131,.1);color:#0FA983;display:block;}
    .msg.err{background:rgba(226,76,77,.1);color:#C2181C;display:block;}
    .bar{height:8px;background:var(--bg2);border-radius:999px;overflow:hidden;margin-top:14px;display:none;}
    .bar span{display:block;height:100%;width:0;background:var(--aurora);transition:width .2s;}
    .links{margin-top:18px;font-size:14px;}
    .links a{color:var(--teal);text-decoration:none;font-weight:600;}
    .gate{text-align:center;padding:60px 20px;color:var(--muted);}
  </style>

  <div class="wrap">
    <h1>Upload <em id="uploadKind">Video Lecture</em></h1>
    <p class="sub">Teachers & admins — add a lecture video or chapter notes for a class & subject.</p>

    <div id="gate" class="gate" style="display:none">
      You must be logged in as a <b>teacher</b> to upload. <a href="login.html">Login</a>
    </div>

    <div class="card" id="form">
      <div class="utype" id="utype" role="tablist" aria-label="What to upload">
        <button type="button" class="utype__tab on" data-utype="video" role="tab" aria-selected="true">Video Lecture</button>
        <button type="button" class="utype__tab" data-utype="note" role="tab" aria-selected="false">Notes</button>
      </div>

      <label id="titleLabel">Video Title *</label>
      <input id="title" placeholder="Numericals — Whole Numbers">

      <div class="row">
        <div>
          <label>Class *</label>
          <select id="className">
            <option>Class 6</option><option>Class 7</option>
            <option>Class 8</option><option>Class 9</option>
          </select>
        </div>
        <div>
          <label>Subject *</label>
          <select id="subject">
            <option>Maths</option><option>Science</option>
            <option>English</option><option>Social Studies</option>
          </select>
        </div>
      </div>

      <label>Topic</label>
      <input id="topic" placeholder="Numericals">

      <label>Description</label>
      <textarea id="description" rows="2" placeholder="What this lecture covers…"></textarea>

      <label id="fileLabel">Video File *</label>
      <div class="drop" id="drop">
        <div class="ico"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 13v8"/><path d="m8 17 4-4 4 4"/><path d="M4 14.9A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.24"/></svg></div>
        <div class="t" id="dropText">Click or drop a video here</div>
        <div class="s" id="dropHint">MP4, up to 500 MB</div>
        <div class="file-name" id="fileName"></div>
      </div>
      <input type="file" id="file" accept="video/*" style="display:none">

      <div class="bar" id="bar"><span id="barFill"></span></div>
      <button class="btn" id="submit">Upload Lecture</button>
      <div class="msg" id="msg"></div>

      <div class="links">
        <a href="videos.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-3px"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg> View video library</a> &nbsp;·&nbsp;
        <a href="dashboard.html">Dashboard</a>
      </div>
    </div>
  </div>

  <script src="api.js"></script>
  <!-- Settings + logout. Needs api.js above it, and it renders nothing
       when nobody is signed in. kid-ui moves its buttons into the rail. -->
  <script src="account-menu.js"></script>
  <script src="../theme.js"></script>
  <script>
    // EduAPI.API_BASE is the final answer — api.js (loaded synchronously above)
    // already resolves the host and applies the localStorage.edulearn_api
    // override safely. The old fallbacks were unreachable, and '/backend-api'
    // was a trap: nothing serves it in dev, so a miss returned index.html and
    // the page died on "Unexpected token '<'". The next line calls EduAPI
    // unguarded anyway, so guarding here bought nothing.
    var API = EduAPI.API_BASE;
    var user = EduAPI.getUser();
    // Only teachers (admin role-as-teacher) may upload.
    if (!user || user.role !== 'teacher') {
      document.getElementById('form').style.display = 'none';
      document.getElementById('gate').style.display = 'block';
    }

    // Pre-select the teacher's OWN class + subject so a lecture is uploaded for
    // the class they actually teach — students of that class then see it.
    (function preselectTeacherClass(){
      if (!user || user.role !== 'teacher') return;
      var teaches = (user.teaches && user.teaches.length) ? user.teaches
                  : (user.className ? [{ className: user.className, subject: user.subject }] : []);
      if (!teaches.length) return;
      var t = teaches[0];
      function setSelect(id, val){
        var sel = document.getElementById(id);
        if (!sel || !val) return;
        var want = String(val).trim().toLowerCase();
        for (var i = 0; i < sel.options.length; i++){
          if (sel.options[i].text.trim().toLowerCase() === want){ sel.selectedIndex = i; return; }
        }
      }
      setSelect('className', t.className);
      setSelect('subject', t.subject);
      // If the teacher teaches multiple subjects/classes, let them pick — but
      // limit the class dropdown to classes they actually teach.
      var classSel = document.getElementById('className');
      if (classSel){
        var myClasses = {};
        teaches.forEach(function(x){ if (x.className) myClasses[String(x.className).trim().toLowerCase()] = true; });
        Array.prototype.slice.call(classSel.options).forEach(function(o){
          if (!myClasses[o.text.trim().toLowerCase()]) o.disabled = true;
        });
        setSelect('className', t.className);
      }
    })();

    var fileInput = document.getElementById('file');
    var drop = document.getElementById('drop');
    drop.addEventListener('click', function(){ fileInput.click(); });
    fileInput.addEventListener('change', function(){
      if (fileInput.files[0]) document.getElementById('fileName').textContent = '✓ ' + fileInput.files[0].name;
    });
    ['dragover','dragenter'].forEach(function(e){ drop.addEventListener(e, function(ev){ ev.preventDefault(); drop.classList.add('over'); }); });
    ['dragleave','drop'].forEach(function(e){ drop.addEventListener(e, function(ev){ ev.preventDefault(); drop.classList.remove('over'); }); });
    drop.addEventListener('drop', function(ev){
      if (ev.dataTransfer.files[0]){ fileInput.files = ev.dataTransfer.files; document.getElementById('fileName').textContent = '✓ ' + ev.dataTransfer.files[0].name; }
    });

    function msg(text, ok){ var m = document.getElementById('msg'); m.textContent = text; m.className = 'msg ' + (ok?'ok':'err'); }

    // Upload type — a lecture video or chapter notes. Both share the same
    // metadata fields (class/subject/topic); only the endpoint, file field,
    // accepted types and copy differ, so it's one form with a toggle rather
    // than two.
    var TYPES = {
      video: { ep:'/api/videos', field:'video', accept:'video/*',
        kind:'Video Lecture', titleLabel:'Video Title *', fileLabel:'Video File *',
        dropText:'Click or drop a video here', dropHint:'MP4, up to 500 MB',
        btn:'Upload Lecture', need:'Please choose a video file.',
        ok:'✓ Uploaded! Students in this class can now watch it.' },
      note: { ep:'/api/notes', field:'note', accept:'.pdf,application/pdf,image/*',
        kind:'Notes', titleLabel:'Notes Title *', fileLabel:'Notes File *',
        dropText:'Click or drop a PDF here', dropHint:'PDF or image, up to 50 MB',
        btn:'Upload Notes', need:'Please choose a PDF or image file.',
        ok:'✓ Uploaded! Students in this class can now open these notes.' }
    };
    var uploadType = 'video';

    function applyType(t){
      uploadType = TYPES[t] ? t : 'video';
      var cfg = TYPES[uploadType];
      var set = function(id, text){ var el = document.getElementById(id); if (el) el.textContent = text; };
      set('uploadKind', cfg.kind);
      set('titleLabel', cfg.titleLabel);
      set('fileLabel', cfg.fileLabel);
      set('dropText', cfg.dropText);
      set('dropHint', cfg.dropHint);
      var sb = document.getElementById('submit'); if (sb && !sb.disabled) sb.textContent = cfg.btn;
      fileInput.setAttribute('accept', cfg.accept);
      // A file chosen for the other type may not fit — clear the selection.
      fileInput.value = ''; document.getElementById('fileName').textContent = '';
      Array.prototype.forEach.call(document.querySelectorAll('.utype__tab'), function(tab){
        var on = tab.getAttribute('data-utype') === uploadType;
        tab.classList.toggle('on', on);
        tab.setAttribute('aria-selected', String(on));
      });
    }

    Array.prototype.forEach.call(document.querySelectorAll('.utype__tab'), function(tab){
      tab.addEventListener('click', function(){ applyType(tab.getAttribute('data-utype')); });
    });

    document.getElementById('submit').addEventListener('click', function(){
      var cfg = TYPES[uploadType];
      var title = document.getElementById('title').value.trim();
      var file = fileInput.files[0];
      if (!title){ msg('Please enter a title.', false); return; }
      if (!file){ msg(cfg.need, false); return; }

      var fd = new FormData();
      fd.append('title', title);
      fd.append('className', document.getElementById('className').value);
      fd.append('subject', document.getElementById('subject').value);
      fd.append('topic', document.getElementById('topic').value.trim());
      fd.append('description', document.getElementById('description').value.trim());
      fd.append('uploaderName', user.name || '');
      fd.append(cfg.field, file);

      var btn = document.getElementById('submit'); btn.disabled = true; btn.textContent = 'Uploading…';
      var bar = document.getElementById('bar'); bar.style.display = 'block';
      var fill = document.getElementById('barFill');

      // XHR for real upload progress.
      var xhr = new XMLHttpRequest();
      xhr.open('POST', API + cfg.ep);
      xhr.setRequestHeader('Authorization', 'Bearer ' + EduAPI.getToken());
      xhr.upload.onprogress = function(e){ if (e.lengthComputable) fill.style.width = Math.round(e.loaded/e.total*100) + '%'; };
      xhr.onload = function(){
        btn.disabled = false; btn.textContent = cfg.btn;
        if (xhr.status === 201){
          msg(cfg.ok, true);
          document.getElementById('title').value=''; document.getElementById('fileName').textContent=''; fileInput.value='';
          setTimeout(function(){ fill.style.width='0'; bar.style.display='none'; }, 1200);
        } else {
          try { msg(JSON.parse(xhr.responseText).error || 'Upload failed', false); } catch(e){ msg('Upload failed ('+xhr.status+')', false); }
        }
      };
      xhr.onerror = function(){ btn.disabled=false; btn.textContent=cfg.btn; msg('Cannot reach server. Is the backend running?', false); };
      xhr.send(fd);
    });
  </script>
