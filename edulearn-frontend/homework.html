<html lang="en">
<head>
<!-- Redesign: dark canvas before any stylesheet parses, so switching pages
     never flashes white. boot.js is not deferred on purpose, the theme
     classes have to be set before the page CSS lands. -->
<meta name="color-scheme" content="dark">
<style>html{background:#050505!important;color-scheme:dark}html body{background:#050505}</style>
<script src="ui/boot.js"></script>
  <meta charset="UTF-8">
  <!-- Apply saved theme before paint to avoid a light-mode flash. -->
  <script>/* light-only product: strip any stale dark preference before paint */try{if(!document.documentElement.classList.contains('kid-dark')){document.documentElement.classList.remove('dark-mode');}localStorage.setItem('edulearn-theme','light');}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Homework | BestBrain</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,480&family=Nunito:wght@400;500;600;700;800;900&family=Fragment+Mono&display=swap" rel="stylesheet">
  <style>
    :root{
      --ink:#1A1F36;--bg:#F7F9FC;--card:#FFFFFF;--muted:#64748B;--bg2:#F5F7FA;
      --line:rgba(15,23,42,.10);--teal:#10B981;--rose:#F43F5E;--amber:#F59E0B;
      --aurora:linear-gradient(115deg,#10B981 0%,#6366F1 48%,#F59E0B 100%);
      --ease:cubic-bezier(.22,1,.36,1);--shadow:0 18px 44px rgba(15,23,42,.10);
    }
    html.dark-mode{
      --ink:#F5F7FA;--bg:#0F172A;--bg2:#1E293B;--card:#1A2847;
      --muted:#94A3B8;--line:rgba(255,255,255,.12);
      --shadow:0 18px 44px rgba(0,0,0,.45);
    }
    *{box-sizing:border-box;}
    /* An author-level `display` outranks the UA's [hidden] rule, so the
       hidden attribute silently stops working. Restore it. */
    [hidden]{display:none !important;}
    body{margin:0;font-family:'Nunito',system-ui,sans-serif;background:var(--bg);color:var(--ink);}
    .wrap{max-width:880px;margin:0 auto;padding:36px 24px 80px;}
    .top-link{display:inline-block;margin-bottom:18px;color:var(--muted);font-size:13px;text-decoration:none;}
    .top-link:hover{color:var(--ink);}
    h1{font-family:'Fraunces',serif;font-weight:480;font-size:32px;margin:0 0 6px;}
    h1 em{font-style:italic;background:var(--aurora);-webkit-background-clip:text;background-clip:text;color:transparent;}
    .sub{color:var(--muted);font-size:14px;margin:0 0 26px;}

    .card{background:var(--card);border:1px solid var(--line);border-radius:20px;
          box-shadow:var(--shadow);padding:24px;margin-bottom:16px;}

    /* ---- the list ---- */
    .hw{display:flex;align-items:flex-start;gap:16px;}
    .hw__body{flex:1;min-width:0;}
    .hw__title{font-family:'Fraunces',serif;font-weight:500;font-size:19px;margin:0 0 4px;}
    .hw__meta{color:var(--muted);font-size:13px;margin:0 0 12px;}
    .hw__instructions{font-size:14px;line-height:1.6;margin:0 0 14px;}

    /* Due-date pill. The three states have to be tellable apart at a glance
       and without relying on colour alone, so each carries its own wording. */
    .pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;
          font-size:12px;font-weight:700;letter-spacing:.02em;white-space:nowrap;}
    .pill.due{background:rgba(245,158,11,.14);color:#B45309;}
    .pill.overdue{background:rgba(244,63,94,.14);color:#BE123C;}
    .pill.done{background:rgba(16,185,129,.14);color:#047857;}
    .pill.late{background:rgba(244,63,94,.12);color:#BE123C;}
    html.dark-mode .pill.due{color:#FCD34D;}
    html.dark-mode .pill.overdue,html.dark-mode .pill.late{color:#FDA4AF;}
    html.dark-mode .pill.done{color:#6EE7B7;}

    .btn{border:none;border-radius:12px;background:var(--aurora);color:#0B1224;font-weight:700;
         font-size:15px;padding:13px 20px;cursor:pointer;min-height:44px;
         transition:transform .2s,box-shadow .2s;}
    .btn:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(61,232,197,.3);}
    .btn:disabled{opacity:.6;cursor:default;transform:none;box-shadow:none;}
    .btn-ghost{border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--ink);
               font-weight:600;font-size:14px;padding:11px 18px;cursor:pointer;min-height:44px;}
    .btn-ghost:hover{border-color:var(--teal);}

    /* ---- the attempt, matching take-test.html's interaction ---- */
    .qnum{font-family:'Fragment Mono',monospace;font-size:12px;letter-spacing:.08em;
          text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
    .qtext{font-size:18px;font-weight:700;line-height:1.45;margin:0 0 18px;}
    .opts{display:grid;gap:10px;}
    .opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
         padding:14px 16px;min-height:52px;border-radius:14px;border:1px solid var(--line);
         background:var(--bg2);color:var(--ink);font-size:15px;font-family:inherit;cursor:pointer;
         transition:border-color .18s,background .18s;}
    .opt:hover{border-color:var(--teal);}
    .opt.is-picked{border-color:var(--teal);background:rgba(16,185,129,.10);}
    .opt__k{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
            background:var(--card);font-family:'Fragment Mono',monospace;font-size:12px;}
    /* review states */
    .opt.bank-right{border-color:var(--teal);background:rgba(16,185,129,.14);}
    .opt.bank-wrong{border-color:var(--rose);background:rgba(244,63,94,.12);}
    .opt__v{margin-left:auto;font-weight:900;font-size:16px;flex:none;}


    .navrow{display:flex;gap:12px;align-items:center;margin-top:20px;flex-wrap:wrap;}
    .prog{color:var(--muted);font-size:13px;margin-left:auto;}

    .expl{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--bg2);
          font-size:14px;line-height:1.6;}
    .expl b{display:block;margin-bottom:4px;font-size:12px;letter-spacing:.06em;
            text-transform:uppercase;color:var(--muted);}

    .score{font-family:'Fraunces',serif;font-size:44px;font-weight:600;line-height:1;}
    .score small{font-size:18px;color:var(--muted);}

    .msg{margin-top:14px;padding:12px 14px;border-radius:11px;font-size:14px;}
    .msg.err{background:rgba(226,76,77,.1);color:#C2181C;}
    .empty{padding:48px 20px;text-align:center;color:var(--muted);}
    .gate{padding:60px 20px;text-align:center;color:var(--muted);}
    .gate a{color:var(--teal);font-weight:600;display:inline-block;padding:12px 4px;min-height:44px;}

    @media (max-width:600px){
      .wrap{padding:24px 16px 64px;}
      h1{font-size:26px;}
      .card{padding:18px;border-radius:16px;}
      .qtext{font-size:17px;}
      .hw{flex-direction:column;gap:12px;}
      .navrow .btn,.navrow .btn-ghost{flex:1;}
    }
  </style>

<div class="wrap">
  <a class="top-link" href="learn.html">&larr; Back to Learn</a>
  <h1>Your <em>Homework</em></h1>
  <p class="sub" id="sub">Work your teacher has set for your class.</p>

  <div id="gate" class="gate" hidden>
    Please <a href="login.html">log in</a> as a student to see your homework.
  </div>

  <!-- list view -->
  <div id="listView">
    <div id="list"></div>
    <div id="empty" class="empty" hidden>No homework set for this chapter yet.</div>
  </div>

  <!-- attempt view -->
  <div id="attemptView" hidden>
    <div class="card">
      <div class="qnum" id="qnum">Question 1</div>
      <p class="qtext" id="qtext"></p>
      <div class="opts" id="opts"></div>
      <div class="navrow">
        <button class="btn-ghost" id="prevBtn" type="button">Previous</button>
        <button class="btn-ghost" id="nextBtn" type="button">Next</button>
        <button class="btn" id="submitBtn" type="button">Submit homework</button>
        <span class="prog" id="prog"></span>
      </div>
      <div id="attemptMsg"></div>
    </div>
  </div>

  <!-- results view -->
  <div id="resultView" hidden>
    <div class="card">
      <div class="score" id="score"></div>
      <p class="sub" id="scoreNote" style="margin-top:10px"></p>
      <button class="btn-ghost" id="backBtn" type="button">Back to homework</button>
    </div>
    <div id="review"></div>
  </div>
</div>

  <script src="api.js"></script>
  <script>
  /* ============================================================
     HOMEWORK, student view
     ------------------------------------------------------------
     Three views in one page: the list of what has been set, the attempt, and
     the marked result. They are separate <section>s toggled with [hidden]
     rather than separate pages, because the attempt has unsaved answers in
     memory, navigating away to mark it would mean posting them somewhere
     first, and there is nothing to post to until the student submits.

     Answers are held client-side and sent once. The server grades: nothing
     here knows a correctIndex until the submit response comes back, which is
     the same contract take-test.html works to.
     ============================================================ */
  (function () {
    'use strict';

    var params = new URLSearchParams(location.search);
    var chapterSlug = params.get('ch') || '';
    var subjectKey = params.get('subject') || '';
    var SUBJECT_NAME = { maths: 'Maths', science: 'Science', social: 'Social Science', english: 'English', hindi: 'Hindi' };
    var subject = SUBJECT_NAME[subjectKey] || '';

    var el = function (id) { return document.getElementById(id); };
    var listView = el('listView'), attemptView = el('attemptView'), resultView = el('resultView');

    function show(view) {
      listView.hidden = view !== 'list';
      attemptView.hidden = view !== 'attempt';
      resultView.hidden = view !== 'result';
    }

    /* Paint a right/wrong verdict so it survives the skin.
       kid-bg turns any near-white opaque surface into glass by writing
       background-color and border-color INLINE with !important, no stylesheet
       rule can outrank that, which is why .opt.bank-right rendered identical
       to every other option. Setting the same properties inline afterwards
       replaces those declarations, and the low-alpha accent this writes does
       not meet the pass's own >=.82-alpha bar, so it is not glassed again.

       The glyph is not decoration. Correctness must not depend on colour
       alone, for colour-blind readers, and because this is exactly the sort
       of styling a later skin pass can take away again. */
    function markState(node, kind) {
      var teal = 'rgba(16,185,129,.22)', rose = 'rgba(244,63,94,.20)';
      var edge = kind === 'right' ? '#10B981' : '#F43F5E';
      node.style.setProperty('background-color', kind === 'right' ? teal : rose, 'important');
      node.style.setProperty('border-color', edge, 'important');
      var glyph = document.createElement('span');
      glyph.className = 'opt__v';
      glyph.textContent = kind === 'right' ? '✓' : '✗';
      glyph.style.setProperty('color', edge, 'important');
      glyph.setAttribute('aria-label', kind === 'right' ? 'correct answer' : 'your answer, incorrect');
      node.appendChild(glyph);
    }

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // "in 3 days" reads better than a date for work that is due soon, and a
    // date reads better than "in 41 days" for work that is not.
    function dueLabel(iso) {
      var due = new Date(iso), now = new Date();
      var days = Math.round((due - now) / 86400000);
      if (days < 0) return 'was due ' + Math.abs(days) + (Math.abs(days) === 1 ? ' day' : ' days') + ' ago';
      if (days === 0) return 'due today';
      if (days === 1) return 'due tomorrow';
      if (days <= 14) return 'due in ' + days + ' days';
      return 'due ' + due.toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
    }

    function pillFor(h) {
      if (h.status === 'submitted') return '<span class="pill done">Submitted · ' + h.score + '/' + h.total + '</span>';
      if (h.status === 'late') return '<span class="pill late">Submitted late · ' + h.score + '/' + h.total + '</span>';
      if (h.overdue) return '<span class="pill overdue">Overdue · ' + esc(dueLabel(h.dueAt)) + '</span>';
      return '<span class="pill due">' + esc(dueLabel(h.dueAt)) + '</span>';
    }

    // ---------------- list ----------------
    function renderList(rows) {
      var list = el('list');
      el('empty').hidden = rows.length > 0;
      list.innerHTML = rows.map(function (h) {
        var done = h.status === 'submitted' || h.status === 'late';
        return '<div class="card hw">' +
          '<div class="hw__body">' +
            '<h2 class="hw__title">' + esc(h.title) + '</h2>' +
            '<p class="hw__meta">' + esc(h.subject) + (h.chapterSlug ? ' · ' + esc(h.chapterSlug.replace(/-/g, ' ')) : '') +
              ' · ' + h.questionCount + ' question' + (h.questionCount === 1 ? '' : 's') + '</p>' +
            (h.instructions ? '<p class="hw__instructions">' + esc(h.instructions) + '</p>' : '') +
            pillFor(h) +
          '</div>' +
          '<button class="' + (done ? 'btn-ghost' : 'btn') + '" data-open="' + esc(h.id) + '"' +
            (done ? ' disabled' : '') + ' type="button">' +
            (done ? 'Handed in' : 'Start') + '</button>' +
        '</div>';
      }).join('');

      Array.prototype.forEach.call(list.querySelectorAll('[data-open]'), function (b) {
        b.addEventListener('click', function () { openHomework(b.getAttribute('data-open')); });
      });
    }

    // ---------------- attempt ----------------
    var A = null; // { id, questions[], answers{}, i }

    function openHomework(id) {
      EduAPI.getHomework(id).then(function (res) {
        A = { id: id, questions: res.questions || [], answers: {}, i: 0, title: res.homework.title };
        if (!A.questions.length) { alert('This homework has no questions yet.'); return; }
        show('attempt');
        paintQuestion();
      }).catch(function (e) {
        alert(e && e.message ? e.message : 'Could not open that homework.');
      });
    }

    function paintQuestion() {
      var q = A.questions[A.i];
      el('qnum').textContent = 'Question ' + (A.i + 1) + ' of ' + A.questions.length;
      el('qtext').textContent = q.text;
      var picked = A.answers[q.id];
      el('opts').innerHTML = q.options.map(function (o, i) {
        return '<button class="opt' + (picked === i ? ' is-picked' : '') + '" data-i="' + i + '" type="button">' +
          '<span class="opt__k">' + String.fromCharCode(65 + i) + '</span>' +
          '<span>' + esc(o) + '</span></button>';
      }).join('');
      Array.prototype.forEach.call(el('opts').querySelectorAll('.opt'), function (b) {
        b.addEventListener('click', function () {
          A.answers[q.id] = Number(b.getAttribute('data-i'));
          paintQuestion();
          updateProgress();
        });
      });
      el('prevBtn').disabled = A.i === 0;
      el('nextBtn').disabled = A.i >= A.questions.length - 1;
      updateProgress();
    }

    function updateProgress() {
      var answered = Object.keys(A.answers).length;
      el('prog').textContent = answered + ' of ' + A.questions.length + ' answered';
      // Submitting with blanks is allowed, they are marked wrong, exactly as
      // the server grades them, so the button is never disabled. Making the
      // student answer everything to hand in would be a different rule than
      // the one the API enforces.
    }

    // A is null until a homework is opened, and these buttons exist in the DOM
    // from the start, hidden with the attempt view, but still clickable by a
    // script, and still focusable. Without the guard they throw on A.i.
    el('prevBtn').addEventListener('click', function () { if (A && A.i > 0) { A.i--; paintQuestion(); } });
    el('nextBtn').addEventListener('click', function () { if (A && A.i < A.questions.length - 1) { A.i++; paintQuestion(); } });

    el('submitBtn').addEventListener('click', function () {
      if (!A) return;
      var answered = Object.keys(A.answers).length;
      if (answered < A.questions.length &&
          !confirm((A.questions.length - answered) + ' question(s) are unanswered. Submit anyway?')) return;

      var answers = A.questions.map(function (q) {
        return { questionId: q.id, selectedIndex: A.answers[q.id] === undefined ? -1 : A.answers[q.id] };
      });
      el('submitBtn').disabled = true;
      EduAPI.submitHomework(A.id, answers).then(function (res) {
        renderResult(res);
      }).catch(function (e) {
        el('attemptMsg').innerHTML = '<div class="msg err">' +
          esc(e && e.message ? e.message : 'Could not submit.') + '</div>';
      }).finally(function () { el('submitBtn').disabled = false; });
    });

    // ---------------- result ----------------
    function renderResult(res) {
      var s = res.submission;
      el('score').innerHTML = s.score + ' <small>/ ' + s.total + '</small>';
      el('scoreNote').textContent = s.status === 'late'
        ? 'Handed in after the due date, it still counts, and your teacher can see it was late.'
        : 'Handed in on time.';

      el('review').innerHTML = (res.review || []).map(function (r, n) {
        return '<div class="card">' +
          '<div class="qnum">Question ' + (n + 1) + (r.isCorrect ? ' · correct' : ' · incorrect') + '</div>' +
          '<p class="qtext">' + esc(r.text) + '</p>' +
          '<div class="opts">' + r.options.map(function (o, i) {
            var cls = 'opt';
            if (i === r.correctIndex) cls += ' bank-right';
            else if (i === r.selectedIndex) cls += ' bank-wrong';
            return '<div class="' + cls + '">' +
              '<span class="opt__k">' + String.fromCharCode(65 + i) + '</span>' +
              '<span>' + esc(o) + '</span></div>';
          }).join('') + '</div>' +
          (r.explanation ? '<div class="expl"><b>Why</b>' + esc(r.explanation) + '</div>' : '') +
        '</div>';
      }).join('');

      // after innerHTML, so the nodes exist to be marked
      (res.review || []).forEach(function (r, n) {
        var card = el('review').children[n];
        if (!card) return;
        var opts = card.querySelectorAll('.opt');
        if (opts[r.correctIndex]) markState(opts[r.correctIndex], 'right');
        if (!r.isCorrect && r.selectedIndex >= 0 && opts[r.selectedIndex]) {
          markState(opts[r.selectedIndex], 'wrong');
        }
      });

      show('result');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    el('backBtn').addEventListener('click', function () { show('list'); load(); });

    // ---------------- boot ----------------
    function load() {
      if (!window.EduAPI || !EduAPI.getUser || !EduAPI.getUser()) {
        el('gate').hidden = false;
        listView.hidden = true;
        return;
      }
      if (chapterSlug) {
        el('sub').textContent = 'Homework for this chapter.';
      }
      EduAPI.getAssignedHomework(subject || undefined, chapterSlug || undefined)
        .then(function (res) { renderList(res.homework || []); })
        .catch(function () {
          el('list').innerHTML = '<div class="msg err">Could not load your homework. Check your connection and try again.</div>';
        });
    }

    load();
  })();
  </script>

  <script src="account-menu.js"></script>
  <script src="../theme.js"></script>
</body>
