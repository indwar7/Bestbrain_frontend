<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!--
      The redesigned skin. `color-scheme` and the inline rule below run before
      any stylesheet is parsed, which is what stops the browser painting a
      white frame between routes. boot.js is deliberately NOT deferred: it has
      to set the theme classes before the page CSS lands, or the first frame
      is the old light theme.
    -->
    <meta name="color-scheme" content="dark" />
    <style>
      html { background: #050505 !important; color-scheme: dark; }
      html body { background: #050505; }
    </style>
    <script src="/ui/boot.js"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>BestBrain · Learn Smart, Score Better</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Swapped per route by usePageChrome(); see src/lib/pageFonts.ts.
         The pages do not all request the same Fraunces weights. -->
    <link id="page-fonts" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Nunito:wght@400;500;600;700;800;900&family=Fragment+Mono:ital@0;1&display=swap" rel="stylesheet" />

    <!--
      Stylesheet order is load-bearing. It mirrors the static site exactly:

        theme.css  ->  the active page's own CSS  ->  vivid.css

      vivid.css is last so its platform-wide overrides win by source order,
      which is how it was authored. #page-css is the swap slot: each route
      writes its lifted stylesheet there via usePageCss(). Do not reorder,
      and do not import global CSS from JS - Vite would append it after
      vivid.css and quietly outrank the theme.
    -->
    <link id="theme-css" rel="stylesheet" href="/theme.css" />
    <style id="page-css"></style>
    <link rel="stylesheet" href="/vivid.css" />

    <style>
      /*
        #root must not introduce a box between <body> and the page content.
        The lifted stylesheets set heights, flex and grid layouts directly on
        body, as they could, when the markup was body's direct children, and
        an extra wrapper breaks those chains. The visible symptom is the page
        background stopping at content height instead of filling the viewport.
        display:contents removes the wrapper from layout while keeping it as
        React's mount point.
      */
      #root { display: contents; }
    </style>

    <!-- Per-route chrome corrections; see usePageChrome(). Last so it wins. -->
    <style id="chrome-css"></style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!--
      Shared page scripts, carried over from the static site where every page
      loaded them. Both are self-contained DOM scripts that append themselves
      to <body> once, so they survive client-side route changes the same way
      they existed on every page before. The .html links features-panel.js
      builds are translated by useLegacyLinks().
    -->
    <script defer src="/curriculum.js"></script>
    <script defer src="/theme.js"></script>
    <script defer src="/account-menu.js"></script>
    <script defer src="/features-panel.js"></script>

    <!--
      The skin. Same contract as the scripts above: self-contained vanilla DOM
      scripts that attach once and keep working across client-side navigation
      (each watches the DOM for the content a route swaps in).

      Only the look ships. kid-bg restyles surfaces, ink and the background;
      kid-quiz clarifies the answer options; kid-content sorts chapters that
      have real content to the top. Every screen keeps the layout it has today.

      kid-ui moves the nav into the left rail, the same shell on every screen.

      Deliberately NOT here:
        kid-home.js, replaces the homepage body outright, which would leave
                      React's tree and the DOM disagreeing on the one route
                      the router owns most.
        session.js , seeds a demo login, which has no business in a build.
    -->
    <script defer src="/ui/kid-bg.js"></script>
    <script defer src="/ui/kid-ui.js"></script>
    <script defer src="/ui/kid-home.js"></script>
    <script defer src="/ui/kid-auth.js"></script>
    <script defer src="/ui/kid-call.js"></script>
    <script defer src="/ui/kid-quiz.js"></script>
    <script defer src="/ui/kid-content.js"></script>
    <script defer src="/ui/kid-progress.js"></script>
    <script defer src="/ui/kid-pdf.js"></script>
  </body>
</html>
